name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch fonts
        run: |
          mkdir -p app/src/main/res/font app/src/main/assets
          curl -sSfL -o app/src/main/res/font/manrope.ttf "https://github.com/google/fonts/raw/main/ofl/manrope/Manrope%5Bwght%5D.ttf"
          curl -sSfL -o app/src/main/res/font/space_grotesk.ttf "https://github.com/google/fonts/raw/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf"
          cp app/src/main/res/font/manrope.ttf app/src/main/assets/

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Recall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Recall-apk
          path: Recall.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Recall 1.0.${{ github.run_number }}
          body: |
            Download **Recall.apk** below on your Android phone and open it to install or update.
          files: Recall.apk
          make_latest: true
